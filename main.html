<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>danhgia</title>
    <link rel="stylesheet" href="./main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- header -->
    <header>
        <h1>PHÚC STYLIST XIN CHÀO QUÝ KHÁCH</h1>
        <h2>Vui Lòng Đánh Giá Sự Hài Lòng Của Quý Khách</h2>
    </header>
    <!-- form đánh giá -->
    <div class="container">
        <form onsubmit="hienThiDiemTrungBinh(event)" id="ratingForm" class="text-center mt-5">
            <div class="rating">
                <input type="radio" name="rating" id="star5" value="5" required>
                <label for="star5"><i class="fas fa-star"></i></label>
                <input type="radio" name="rating" id="star4" value="4">
                <label for="star4"><i class="fas fa-star"></i></label>
                <input type="radio" name="rating" id="star3" value="3">
                <label for="star3"><i class="fas fa-star"></i></label>
                <input type="radio" name="rating" id="star2" value="2">
                <label for="star2"><i class="fas fa-star"></i></label>
                <input type="radio" name="rating" id="star1" value="1">
                <label for="star1"><i class="fas fa-star"></i></label>
            </div>
            <div id="improveSection" style="display: none;" class="mt-3">
                <label for="improveInput">Quý khách chưa hài lòng ở điểm nào tại Phúc Stylist:</label>
                <input type="text" id="improveInput" class="form-control" placeholder="Nhập ý kiến của bạn">
            </div>
            <button type="submit" class="btn btn-primary mt-3">Gửi Đánh Giá</button>
        </form>
        <div id="feedback" class="mt-3"></div>
    </div>
    <!-- danh sách đánh giá -->
    <div style="border: 1px solid black; border-radius: 5px;">
        <h3 style="padding: 20px;padding-bottom: 0px;">Danh Sách Đánh Giá</h3>
        <div class="rating-container">
            <div id="diemTB" class="rating-score">trên 5 <span class="stars">★★★★★</span></div>
        </div>
        <table style="margin-left: 20px;" class="table table-bordered">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Sao</th>
                    <th scope="col">Nhận Xét</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <script src="./main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
        integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
        integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
        crossorigin="anonymous"></script>
